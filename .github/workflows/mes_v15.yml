
name: MES Paper Trader V15

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: mes-paper-trader-v15
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install pandas yfinance
      - name: Run delayed MES paper simulator
        run: python mes_paper_trader_v15.py
      - name: Save simulated state and trades
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f mes_v15_state.json ]; then git add mes_v15_state.json; fi
          if [ -f mes_v15_trades.csv ]; then git add mes_v15_trades.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update MES V15 paper state [skip ci]'
            git push
          fi
