
name: MES Paper Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: mes-paper-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install --disable-pip-version-check pandas yfinance
      - name: Check MES signals
        run: python mes_phone_bot.py
      - name: Save state and signals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f mes_state.json ]; then git add mes_state.json; fi
          if [ -f mes_signals.csv ]; then git add mes_signals.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update MES paper monitor state [skip ci]'
            git push
          fi
  
