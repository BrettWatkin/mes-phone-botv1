
name: MES Paper Trader V16

on:
  workflow_dispatch:
    inputs:
      test_discord:
        description: Send a test Discord alert
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: mes-paper-trader
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: python -m pip install pandas yfinance

      - name: Send test Discord alert
        if: ${{ inputs.test_discord == true }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python mes_paper_trader_v16.py --test-notification

      - name: Run V16 simulator
        if: ${{ inputs.test_discord != true }}
        run: python mes_paper_trader_v16.py

      - name: Save paper trading state
        if: ${{ inputs.test_discord != true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f mes_v15_state.json ]; then git add mes_v15_state.json; fi
          if [ -f mes_v15_trades.csv ]; then git add mes_v15_trades.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update MES paper trades [skip ci]'
            git push
          fi

      - name: Send trade notifications
        if: ${{ inputs.test_discord != true }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python mes_paper_trader_v16.py --notify

      - name: Notify on error
        if: ${{ failure() && inputs.test_discord != true }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python mes_paper_trader_v16.py --error-notification
